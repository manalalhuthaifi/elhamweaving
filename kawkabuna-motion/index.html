<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>كوكبنا يزهر بالتسامح — موشن</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf1e7;--ink:#3b2d6b;--lav:#9b7fd4;--lav2:#c9b6ec;--green:#b1d09a;--blue:#b9d6ec;--pink:#f0b6c9}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);font-family:'Cairo',Tahoma,Arial,sans-serif;color:var(--ink);overflow:hidden}
.stage{position:relative;height:100dvh;min-height:560px;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.top{position:relative;z-index:3;text-align:center;padding:clamp(18px,5vh,56px) 16px 0;width:100%}
.tag{display:inline-block;background:var(--pink);padding:6px 26px;font-weight:800;font-size:clamp(14px,2.4vw,24px);box-shadow:0 0 0 2px #f6d3de inset;transform:translateY(-60px);opacity:0;animation:drop .8s .2s cubic-bezier(.2,1.4,.4,1) forwards}
h1{margin:clamp(8px,2vh,22px) 0 0;font-weight:900;line-height:1.12;font-size:clamp(40px,min(9vw,13vh),118px)}
h1 .w{display:inline-block;opacity:0;transform:translateY(40px) scale(.9);animation:rise .8s cubic-bezier(.2,1.3,.4,1) forwards}
h1 .w1{animation-delay:.6s}h1 .w2{animation-delay:.85s;color:var(--lav);position:relative}h1 .w3{animation-delay:1.1s}
h1 .w2::after{content:"";position:absolute;inset:auto 0 4% 0;height:.12em;background:var(--lav2);border-radius:9px;transform:scaleX(0);transform-origin:right;animation:line .9s 1.6s ease forwards;z-index:-1}
.sub{margin-top:10px;font-weight:800;font-size:clamp(14px,2vw,22px);opacity:0;animation:fade 1s 1.7s forwards}
.scene{position:absolute;inset:auto 0 0 0;height:56%;z-index:2;pointer-events:none}
.el{position:absolute;filter:drop-shadow(0 8px 10px rgba(80,50,120,.18));height:auto;opacity:0;will-change:transform}
  .girl{width:min(23vw,27vh);bottom:12%;right:3%;animation:pop .9s 1.4s cubic-bezier(.2,1.3,.4,1) forwards,bob 4.5s 2.3s ease-in-out infinite}
  .pair{width:min(40vw,46vh);bottom:12%;left:50%;margin-left:calc(min(40vw,46vh)/-2);animation:pop .9s 1.7s cubic-bezier(.2,1.3,.4,1) forwards,bob 5s 2.6s ease-in-out infinite reverse}
  .bouq{width:min(22vw,26vh);bottom:12%;left:3%;transform-origin:50% 100%;animation:pop .9s 2s cubic-bezier(.2,1.3,.4,1) forwards,sway 4s 2.9s ease-in-out infinite}
  .globe{width:min(18vw,22vh);bottom:56%;left:50%;margin-left:min(13vw,18vh);animation:pop 1s 1.2s cubic-bezier(.2,1.3,.4,1) forwards,float 6s 2.2s ease-in-out infinite}
.waves{direction:ltr;position:absolute;left:0;right:0;bottom:0;height:20%;z-index:1;overflow:hidden}
.waves svg{position:absolute;bottom:0;left:0;width:200%;height:100%;animation:wave 14s linear infinite}
.waves svg.b{animation-duration:20s;animation-direction:reverse}
.petals{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-30px;width:14px;height:20px;border-radius:70% 0 70% 0;background:var(--lav2);opacity:.75;animation:fall linear infinite}
button.replay{position:fixed;top:12px;inset-inline-start:12px;z-index:9;min-height:44px;padding:8px 16px;border:2px solid var(--ink);background:#fff;border-radius:999px;font:800 15px 'Cairo',sans-serif;color:var(--ink);cursor:pointer}
@keyframes drop{to{transform:none;opacity:1}}@keyframes rise{to{opacity:1;transform:none}}@keyframes fade{to{opacity:1}}@keyframes line{to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:translateY(60px) scale(.85)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-10px)}}@keyframes sway{50%{transform:rotate(3deg)}25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
@keyframes float{50%{transform:translateY(-14px) rotate(4deg)}}@keyframes wave{to{transform:translateX(-50%)}}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(540deg)}}
@media(max-width:700px){h1{font-size:clamp(52px,17vw,96px)}.top{padding-top:8vh}.scene{height:58%}.girl{width:30vw;right:2%;bottom:14%}.pair{width:48vw;margin-left:-24vw;bottom:14%}.bouq{width:27vw;left:2%;bottom:14%}.globe{width:34vw;bottom:50%;margin-left:6vw}}
@media(max-height:560px) and (orientation:landscape){.scene{height:50%}h1{font-size:clamp(30px,7vh,60px)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style></head><body>
