:root{--navy:#0f2f5c;--ink:#17395f;--mut:#4a6177;--sky:#bfe4f9;--cream:#fbefd0;--peach:#f6a98b;--blue:#2f5fa0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--sky)}
body{font-family:Cairo,system-ui,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;line-height:1.55}
body.lock{overflow:hidden}
#bgfix{position:fixed;top:0;bottom:0;left:50%;width:min(100%,560px);transform:translateX(-50%);background:var(--bg) center/cover no-repeat;z-index:0}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:max(26px,env(safe-area-inset-top)) 16px 30px;text-align:center}
.hero h1{font-size:clamp(36px,10.4vw,62px);white-space:nowrap;font-weight:900;color:var(--navy);line-height:1.2;text-shadow:0 3px 0 rgba(255,255,255,.65)}
.subpill{display:inline-block;margin-top:10px;background:var(--cream);border:3px solid #f1dfae;color:var(--navy);font-weight:800;font-size:clamp(17px,4.6vw,23px);padding:8px 24px;border-radius:999px;box-shadow:0 6px 14px rgba(15,47,92,.12)}
.wheel-wrap{position:relative;width:min(100%,500px);aspect-ratio:1;margin:18px auto 0}
#wheel{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 14px 22px rgba(15,47,92,.22))}
.labels{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;font-weight:900;color:var(--navy);line-height:1.2;direction:rtl;unicode-bidi:plaintext}
.ksu{display:block;height:54px;width:auto;margin:0 auto 10px;border-radius:10px;background:#fff;box-shadow:0 4px 10px rgba(15,47,92,.15)}
.spin-btn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:23.5%;aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;color:#fff;font-family:inherit;font-weight:900;font-size:clamp(15px,4.4vw,24px);line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#4a7cc0,var(--blue) 70%);box-shadow:0 0 0 5px #fff6,inset 0 -6px 10px rgba(0,0,0,.18),0 8px 16px rgba(15,47,92,.3);min-width:48px;min-height:48px;transition:transform .15s}
.spin-btn::before{content:"";position:absolute;inset:7px;border-radius:50%;border:4px dotted #ffffffd9;pointer-events:none}
.spin-btn:active{transform:translate(-50%,-50%) scale(.95)}
.spin-btn:focus-visible,.btn:focus-visible,.chip:focus-visible,.x:focus-visible,.opt:focus-visible{outline:4px solid #ff9d6b;outline-offset:3px}
.spin-btn[disabled]{cursor:default;filter:saturate(.8)}
.hint{margin-top:16px;font-weight:700;font-size:clamp(16px,4.4vw,19px);color:var(--navy)}
.dots{display:flex;justify-content:center;gap:9px;margin-top:10px}
.dots i{width:14px;height:14px;border-radius:50%;background:#ffffffb0;border:2px solid #fff;box-shadow:0 1px 3px rgba(15,47,92,.25)}
.dots i.on{background:var(--peach);border-color:#fff}
.foot{margin-top:22px}
.day{font-weight:900;font-size:22px;color:var(--navy)}
.cred{margin-top:12px;display:flex;flex-direction:column;align-items:center;gap:8px;background:#ffffffb8;border:3px solid #cfe3f3;border-radius:28px;padding:14px 16px}
.cred img{height:46px;width:auto;border-radius:8px;background:#fff}
.cred p{font-weight:700;font-size:15.5px;color:var(--ink);line-height:1.8}
.note{margin:12px auto 0;font-size:14px;color:#17395f;font-weight:700;background:#ffffffc9;border-radius:20px;padding:8px 14px;max-width:440px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(15,47,92,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet-wrap[hidden]{display:none}
.sheet{width:min(100%,560px);max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:#fffdf6;border-radius:36px 36px 0 0;border:4px solid #cfe3f3;border-bottom:0;box-shadow:0 -14px 40px rgba(15,47,92,.3);animation:up .28s ease-out}
@media (min-width:600px){.sheet-wrap{align-items:center}.sheet{border-radius:36px;border-bottom:4px solid #cfe3f3}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-head{display:flex;align-items:center;gap:12px;padding:16px 18px 10px;border-bottom:3px solid #eaf3fb}
.sheet-head img{width:64px;height:64px;object-fit:contain;flex:none}
.sheet-head h2{flex:1;font-size:28px;font-weight:900;color:var(--navy);line-height:1.25;text-align:right}
.x{flex:none;width:48px;height:48px;border-radius:50%;border:3px solid #cfe3f3;background:#fff;color:var(--navy);font-size:20px;font-weight:900;cursor:pointer;font-family:inherit}
.sheet-body{padding:16px 18px 6px;overflow-y:auto;overscroll-behavior:contain;text-align:right;flex:1}
.sheet-foot{padding:12px 18px max(16px,env(safe-area-inset-bottom));border-top:3px solid #eaf3fb;display:flex;gap:10px}
.btn{min-height:52px;padding:10px 22px;border-radius:999px;border:3px solid #cfe3f3;background:#fff;color:var(--navy);font-family:inherit;font-weight:800;font-size:18px;cursor:pointer}
.btn.main{background:var(--blue);border-color:#244d86;color:#fff;flex:1}
.btn.soft{background:#fbefd0;border-color:#f1dfae}
.btn[disabled]{opacity:.55;cursor:default}
.q{background:#eef6fc;border:3px solid #cfe3f3;border-radius:24px;padding:16px 18px;font-size:22px;font-weight:800;color:var(--navy);line-height:1.6}
.q.big{font-size:24px}
.lbl{margin:16px 0 8px;font-weight:800;font-size:17px;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row.two .btn{flex:1}
.chip{min-height:48px;padding:8px 18px;border-radius:999px;border:3px solid #cfe3f3;background:#fff;color:var(--navy);font-family:inherit;font-weight:700;font-size:17px;cursor:pointer}
.chip.on{background:#dcecff;border-color:#2f5fa0}
.opt{display:block;width:100%;min-height:56px;text-align:right;padding:12px 16px;margin-top:10px;border-radius:22px;border:3px solid #cfe3f3;background:#fff;color:var(--ink);font-family:inherit;font-weight:700;font-size:18px;line-height:1.55;cursor:pointer}
.opt.on{background:#dcecff;border-color:#2f5fa0}
.opt small{display:block;margin-top:6px;font-weight:600;font-size:16px;color:var(--mut)}
.opt .tag{display:inline-block;margin-inline-start:8px;background:#dff3e6;border:2px solid #a9dcbb;color:#1d5a35;border-radius:999px;font-size:14px;padding:0 10px;font-weight:800}
.res{margin-top:14px;border-radius:22px;padding:14px 16px;background:#fff1c6;border:3px solid #f3d57a;font-weight:700;font-size:18px;line-height:1.7}
.res b{color:var(--navy)}
.res.g{background:#e1f3e8;border-color:#a9dcbb}
.res.b{background:#e6f1fb;border-color:#b9d8ee}
textarea{width:100%;min-height:96px;border-radius:20px;border:3px solid #cfe3f3;background:#fff;padding:12px 14px;font-family:inherit;font-size:18px;color:var(--ink);resize:vertical;direction:rtl}
textarea:focus{outline:4px solid #ff9d6b66;border-color:#2f5fa0}
.learn{margin-top:16px;border-radius:26px;background:linear-gradient(180deg,#e9f6ee,#dff0e6);border:3px solid #a9dcbb;padding:14px 16px;animation:up .3s ease-out}
.learn h3{font-size:20px;font-weight:900;color:#1d5a35;margin-bottom:4px}
.learn p{font-weight:700;font-size:18px;line-height:1.7;color:#17395f}
.sit{margin-top:12px;border-radius:22px;border:3px solid #cfe3f3;background:#fff;padding:12px 14px}
.sit p{font-weight:800;font-size:18px;color:var(--navy);margin-bottom:8px}
.sit .row{gap:8px}
.sit .chip{min-height:48px;padding:6px 14px;font-size:16.5px}
.sit .ans{margin-top:8px;font-weight:700;font-size:16.5px;color:#1d5a35}
.board{display:block;width:100%;aspect-ratio:4/3;border-radius:22px;border:3px solid #cfe3f3;background:#fff;touch-action:none;cursor:crosshair}
.pal{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;align-items:center}
.sw{width:48px;height:48px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #cfe3f3;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 4px #2f5fa0}
.secret{margin-top:12px;min-height:56px;border-radius:22px;border:3px dashed #f3d57a;background:#fff8dc;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:var(--navy);padding:8px}
.steps{margin-top:12px;font-weight:700;font-size:17px;color:var(--ink);padding-inline-start:22px}
.steps li{margin-top:4px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--navy);color:#fff;border-radius:999px;padding:12px 22px;font-weight:700;z-index:40;transition:.25s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.crd{margin:12px auto 0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 22px;width:fit-content;max-width:100%;background:#ffffffb8;border:3px solid #cfe3f3;border-radius:26px;padding:8px 22px;color:var(--navy);font-weight:700;font-size:clamp(14px,3.8vw,17px);line-height:1.8}.crd b{font-weight:900}.crd span+span{position:relative}

/* wide screens: iPad / landscape */
@media (min-width:768px){
#bgfix{width:100%}
.app{max-width:1280px;padding:max(18px,env(safe-area-inset-top)) 28px 22px}
.hero{display:flex;flex-direction:column;align-items:center}
.hero .ksu{height:66px;width:auto;margin:0 auto 6px}
.hero h1{font-size:clamp(44px,6vw,68px)}
.hero .subpill{margin-top:6px}
.wheel-wrap{width:min(100%,max(460px,calc(100dvh - 330px)),860px);margin-top:14px;container-type:inline-size}
.spin-btn{font-size:20px;font-size:max(20px,5.2cqw)}
.hint{font-size:20px;margin-top:10px}
.foot{margin-top:10px}
.crd{font-size:clamp(15px,1.9vw,19px);margin-top:8px}
.crd span+span::before{content:"";position:absolute;inset-inline-end:calc(100% + 11px);top:20%;bottom:20%;width:2px;background:#b9d3ea;border-radius:2px}
}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin:0 0 6px}
.top .ksu{margin:0!important;height:clamp(44px,12vw,66px)!important;width:auto!important}
.daypill{margin:0;background:#fffbf1;border:3px solid #f1e2bd;border-radius:999px;padding:4px 12px;border-width:2px;color:var(--navy);font-weight:800;font-size:clamp(11px,2.9vw,14px);white-space:nowrap;box-shadow:0 4px 12px #0e2a5a1f}
@media (min-width:1000px){
.hero{display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"logo title pill" "sub sub sub";align-items:center;column-gap:20px}
.top{display:contents}
.hero .ksu{grid-area:logo;justify-self:start;height:70px!important}
.daypill{grid-area:pill;justify-self:end}
.hero h1{grid-area:title;margin:0;font-size:clamp(40px,4.8vw,66px)}
.hero .subpill{grid-area:sub;justify-self:center;margin-top:8px}
.wheel-wrap{width:min(100%,max(460px,calc(100dvh - 290px)),860px)}
}
@media (orientation:landscape) and (min-width:700px){
#bgfix::before,#bgfix::after{content:"";position:absolute;left:0;right:0;height:19vw;background:var(--bg) no-repeat;background-size:100% auto}
#bgfix::before{top:0;background-position:center top}
#bgfix::after{bottom:0;background-position:center bottom}
}
</style>
</head>
<body>
<div id="bgfix" aria-hidden="true"></div>
<main class="app">
  <header class="hero">
    <div class="top"><img id="ksu" class="ksu" alt="شعار جامعة الملك سعود" width="150" height="59"><p class="daypill">اليوم العالمي للطفل · ٢٠ نوفمبر</p></div>
    <h1>عجلة عالم الطفل</h1>
    <p class="subpill">لفّة صغيرة… وفهم أكبر لعالم الطفل</p>
  </header>

  <section class="wheel-wrap" aria-label="عجلة عالم الطفل">
    <svg id="wheel" viewBox="0 0 600 600" role="img" aria-label="عجلة من ثمانية أقسام"></svg>
    <div id="labels" class="labels" aria-hidden="true"></div>
    <button id="spin" class="spin-btn" type="button" aria-label="دوّري العجلة"><span>اضغطي</span></button>
  </section>

  <div class="dots" id="dots" aria-label="الأقسام التي جرّبتِها"></div>

  <footer class="foot"><div class="crd"><span>إعداد: <b>تالا سلطان الشهري</b></span><span>إشراف: <b>د. إسراء سعد دويحي</b></span></div></footer>
</main>

<div id="sheetWrap" class="sheet-wrap" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <img id="sheetIcon" alt="" width="64" height="64">
      <h2 id="sheetTitle"></h2>
      <button id="sheetClose" class="x" type="button" aria-label="إغلاق">✕</button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
    <div class="sheet-foot">
      <button id="again" class="btn main" type="button">لفّة جديدة</button>
    </div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

{id:'tf',title:'صح أو خطأ؟',lines:['صح أو','خطأ؟'],icon:'tf',color:'#c9ecd8',items:[
 {t:'كل طفل ساكت يعني أنه مرتاح.',a:false,e:'السكوت قد يعني راحة، وقد يعني تعبًا أو خجلًا أو أنه لا يجد الكلمات. لا نستنتج من الصمت، بل ندعوه للحديث بلطف دون ضغط.',l:'لا تحكمي من السكوت وحده؛ اعرضي وجودك: «إذا حبيت تحكي أنا موجودة».'},
 {t:'عندما أقول للطفل الخائف «لا تخاف، ما في شيء!» فأنا أطمّنه.',a:false,e:'العبارة تبدو لطيفة لكنها قد تُشعره أن خوفه غير مهم. الأقرب: «أنا معك، وواضح إنك خايف».',l:'اعترفي بالشعور أولًا، ثم طمّنيه.'},
 {t:'الرسم قد يكون طريقة يعبّر بها الطفل عن مشاعره.',a:true,e:'صح، لكن لا نفسّر ألوانه أو رسمته بأنفسنا؛ نسأله: «احكِ لي عن رسمتك» ونترك المعنى له.',l:'الطفل هو الخبير في رسمته، وليس نحن.'},
 {t:'سماع مشاعر الطفل يعني أنني أوافق على كل تصرفاته.',a:false,e:'نتقبّل الشعور ونضع حدًا للتصرّف: «أفهم إنك غضبان، لكن الضرب ممنوع».',l:'قبول الشعور شيء، وقبول السلوك شيء آخر.'},
 {t:'الطفل الذي لا يشارك في نشاط جماعي عنده مشكلة.',a:false,e:'قد يكون خجولًا أو يحتاج وقتًا ليتأكد أن المكان آمن. موقف واحد لا يكفي للحكم.',l:'امنحيه وقتًا، وارحبي بمشاركته متى استعد.'},
 {t:'الأطفال الصغار قادرون دائمًا على شرح سبب مشاعرهم بالكلمات.',a:false,e:'كثير منهم يحتاجون أمثلة وصورًا وألعابًا ليعبّروا، والكلمات تتطوّر مع العمر.',l:'قدّمي له خيارات: «تحس إنك زعلان أو متضايق أو تعبان؟».'},
 {t:'إذا بكى الطفل كثيرًا فهو يحاول أن يزعجنا.',a:false,e:'البكاء لغة الطفل عندما تعجز الكلمات؛ وراءه غالبًا تعب أو خوف أو حاجة لم تُلبَّ.',l:'اسألي نفسك: وش يحتاج الآن؟'},
 {t:'الطفل يستفيد حين نعترف أمامه بأننا أخطأنا ونعتذر.',a:true,e:'صح، الاعتذار يعلّمه أن الأخطاء تُصلَح وأن العلاقة تبقى آمنة.',l:'«آسفة إني رفعت صوتي، كنت متعبة» تعلّم الطفل الكثير.'},
 {t:'مدح الطفل على جهده أنفع من مدحه على ذكائه فقط.',a:true,e:'«شفت كم حاولت!» تشجّع على المحاولة، بينما مدح الذكاء وحده قد يخيفه من الخطأ.',l:'امدحي المحاولة والصبر، لا النتيجة فقط.'},
 {t:'تجاهل نوبة الغضب دائمًا هو أفضل طريقة للتعامل معها.',a:false,e:'نحافظ على هدوئنا ونبقى قريبين، ثم نتكلم بعد أن يهدأ؛ الطفل لا يحتاج أن يُترك وحده مع شعور كبير.',l:'ابقي قريبة وهادئة حتى تمرّ العاصفة.'}
]},
{id:'rephrase',title:'بدّلي العبارة',lines:['بدّلي','العبارة'],icon:'chat',color:'#ddd2f5',items:[
 {p:'أنت تبكي على كل شيء!',s:'شكلك متضايق، تبغى تحكي لي وش صار؟',l:'العبارة التي تصف الشعور وتسأل سؤالًا مفتوحًا تفتح الحوار بدل أن تغلقه.'},
 {p:'بطّل دلع!',s:'أحس إنك تحتاجني الحين. وش اللي ضايقك؟',l:'خلف التصرّف احتياج؛ سؤالك عن الاحتياج أقرب من الحكم على السلوك.'},
 {p:'ما فيه شيء يستاهل الخوف.',s:'أفهم إنك خايف. أنا معك، وخلنا نشوف مع بعض وش يطمّنك.',l:'الاعتراف بالخوف ثم البقاء بجانبه يعلّمه أن مشاعره مقبولة.'},
 {p:'اسكت، تعبتني!',s:'أنا تعبانة شوي، بس أبغى أسمعك. أعطيني لحظة وبعدها نتكلم.',l:'يحقّ لك أن تتعبي، والصدق مع الطفل بهدوء يعلّمه أن للجميع حدودًا.'},
 {p:'ليش ما تسمع الكلام أبدًا؟',s:'يبدو إن الموضوع صعب عليك الحين. وش اللي يخليك تتضايق؟',l:'تجنّبي «أبدًا» و«دائمًا»؛ التعميم يشعر الطفل أنه سيئ، ووصف الموقف يشعره أنه مفهوم.'},
 {p:'عيب عليك تخاف من الظلام!',s:'الظلام يخوّف كثيرين. تبغاني أجلس معك شوي؟',l:'الخوف شعور طبيعي، والسخرية منه تجعل الطفل يخفيه بدل أن يحكيه.'},
 {p:'وقف عن الصراخ!',s:'صوتك عالي لأنك زعلان، صح؟ قول لي وش ضايقك بصوت هادي وأنا أسمعك.',l:'نصف الصراخ رسالة؛ نسمع الرسالة ثم نعلّمه طريقة أهدأ.'},
 {p:'أخوك أحسن منك!',s:'أشوف إنك تحاول، وأنا أحبك كما أنت.',l:'المقارنة تجرح؛ الطفل يحتاج أن يُرى كما هو.'},
 {p:'خلاص لا تبكي، ما صار شيء!',s:'صار شيء مهم عندك، وأنا هنا. خذ وقتك.',l:'«ما صار شيء» تقلّل الشعور؛ الاعتراف به يهدّئه.'}
]},

/* بطاقة الرسالة (تُنشأ على الجهاز فقط) */
function wrapText(g,text,maxW){var words=text.split(/\s+/),lines=[],cur='';words.forEach(function(w){var t=cur?cur+' '+w:w;if(g.measureText(t).width>maxW&&cur){lines.push(cur);cur=w}else cur=t});if(cur)lines.push(cur);return lines}
function makeCard(text){
  var W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;var g=cv.getContext('2d');
  var img=new Image();
  function finish(){
    g.direction='rtl';g.textAlign='center';
    var x=90,y=300,w=W-180,hh=700,r=70;
    g.fillStyle='rgba(255,255,255,.93)';g.strokeStyle='#cfe3f3';g.lineWidth=6;
    g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+hh,r);g.arcTo(x+w,y+hh,x,y+hh,r);g.arcTo(x,y+hh,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();g.fill();g.stroke();
    g.fillStyle='#0f2f5c';g.font='900 86px Cairo, sans-serif';g.fillText('رسالة لطفل',W/2,190);
    var fs=70;g.font='800 '+fs+'px Cairo, sans-serif';var lines=wrapText(g,text,w-140);
    while(lines.length>6&&fs>40){fs-=4;g.font='800 '+fs+'px Cairo, sans-serif';lines=wrapText(g,text,w-140)}
    var lh=fs*1.6,sy=y+hh/2-(lines.length-1)*lh/2+fs*.3;
    g.fillStyle='#17395f';lines.forEach(function(l,k){g.fillText(l,W/2,sy+k*lh)});
    g.fillStyle='#0f2f5c';g.font='800 46px Cairo, sans-serif';g.fillText('عجلة عالم الطفل',W/2,1110);
    g.font='700 36px Cairo, sans-serif';g.fillStyle='#274a6d';g.fillText('اليوم العالمي للطفل · ٢٠ نوفمبر',W/2,1170);
    try{cv.toBlob(function(b){if(!b){toast('تعذّر إنشاء الصورة');return}var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='رسالة-لطفل.png';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);toast('تم حفظ البطاقة')},'image/png')}catch(e){toast('تعذّر إنشاء الصورة')}
  }
  function go(){(document.fonts&&document.fonts.load?document.fonts.load('900 60px Cairo','رسالة'):Promise.resolve()).then(finish,finish)}
  img.onload=function(){g.drawImage(img,0,0,W,H);go()};img.onerror=function(){g.fillStyle='#bfe4f9';g.fillRect(0,0,W,H);go()};img.src=A.bg||'';
}
